[package]
name        = "bayesian-opponent-modeling-in-poker"
version     = "0.1.1"
description = "Implementations of No-Limit Texas Hold-Em solution."
homepage    = "https://github.com/Smokeybear10/bayesian-opponent-modeling-in-poker"
repository  = "https://github.com/Smokeybear10/bayesian-opponent-modeling-in-poker"
readme      = "README.md"
keywords    = ["poker", "cards", "cfr", "mcts", "holdem"]
edition     = "2021"
include     = ["/src/**", "/benches/**", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/README.md", "/NOTICE"]

[dependencies]
log               = "0.4.22"
petgraph          = { optional = true, version = "0.6.5" }
bytes             = { optional = true, version = "1.0" }
byteorder         = { optional = true, version = "1.5.0" }
futures           = { optional = true, version = "0.3" }
serde_json        = { optional = true, version = "1.0" }
rand              = {                   version = "0.9.1",   features = ["small_rng"]  }
getrandom         = { optional = true,  version = "0.3.3",   features = ["wasm_js"]    }
colored           = { optional = true,  version = "2.0"                                }
rayon             = { optional = true,  version = "1.10.0"                             }
indicatif         = { optional = true,  version = "0.17.8"                             }
simplelog         = { optional = true,  version = "0.12.2"                             }
tokio             = { optional = true,  version = "1.0",     features = ["full"]       }
tokio-postgres    = { optional = true,  version = "0.7"                                }
clap              = { optional = true,  version = "4.0",     features = ["derive"]     }
actix-web         = { optional = true,  version = "4.4"                                }
actix-cors        = { optional = true,  version = "0.6"                                }
serde             = { optional = true,  version = "1.0",     features = ["derive"]     }
js-sys            = { optional = true, version = "0.3" }
wasm-bindgen      = { optional = true, version = "0.2" }
console_error_panic_hook = { optional = true, version = "0.1.7" }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bayesian-opponent-modeling-in-poker"
path = "src/main.rs"
required-features = ["native"]

[dev-dependencies]
criterion         = { version = "0.3", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
required-features = ["native"]

[features]

default = ["native"]

wasm = ["dep:getrandom", "dep:js-sys", "dep:wasm-bindgen", "dep:console_error_panic_hook"]

# Run On Big Machine features
native = [
    "dep:petgraph",
    "dep:bytes",
    "dep:byteorder",
    "dep:futures",
    "dep:serde_json",
    "clap",
    "colored",
    "indicatif",
    "rayon",
    "simplelog",
    "tokio",
    "tokio-postgres",
    "serde",
    "actix-web",
    "actix-cors"
]

# Task-specific features
cluster  = ["native"]
trainer  = ["native"]
publish  = ["native"]
analyze  = ["native"]

# Small-scale demo (fast clustering + training, separate pgcopy/demo/ output)
demo     = ["native"]

# Optional game variants
shortdeck = []
