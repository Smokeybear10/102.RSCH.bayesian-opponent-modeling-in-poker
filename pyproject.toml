[project]
name = "river-poker"
version = "0.4.0"
description = "Heads-up poker research, tournament policies and competition preparation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pokerkit==0.7.7",
    "eval7==0.1.11",
    "scipy==1.18.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "httpx==0.28.1",
]

[project.scripts]
headsup = "headsup.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["headsup", "competition"]

[tool.hatch.build.targets.sdist]
include = [
    "/headsup",
    "/competition",
    "/tests",
    "/scripts",
    "/research",
    "/docs/architecture.md",
    "/docs/competition.md",
    "/artifacts/event-day-kit.zip",
    "/eventday-kit.json",
    "/reports",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
]
