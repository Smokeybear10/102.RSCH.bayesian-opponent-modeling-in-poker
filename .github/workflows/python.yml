name: Python

on:
  push:
    paths:
      - "headsup/**"
      - "scripts/**"
      - "tests/**"
      - "research/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "headsup/**"
      - "scripts/**"
      - "tests/**"
      - "research/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.15"
          python-version: "3.12.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.6.0"
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - name: Verify published research evidence
        run: uv run --locked python scripts/verify_research.py research/results/replication-20261107
      - name: Exercise research pipeline
        run: >-
          uv run --locked python scripts/run_research.py
          --output runs/ci-smoke --export runs/ci-smoke-export
          --seeds 20261107000 --warmup 8 --pairs 4 --samples 32 --jobs 2
      - run: uv run --locked python scripts/verify_research.py runs/ci-smoke-export
      - run: uv run --locked python scripts/audit_research_run.py runs/ci-smoke
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: river-python-distributions
          path: dist/*
          if-no-files-found: error
